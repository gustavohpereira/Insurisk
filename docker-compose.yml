services:
  postgres:
    image: postgres:16-alpine
    container_name: insurisk-postgres
    environment:
      POSTGRES_USER: insurisk
      POSTGRES_PASSWORD: insurisk
      POSTGRES_DB: insurisk_quotes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: insurisk-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: insurisk-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  mongo_data:
  rabbitmq_data:
